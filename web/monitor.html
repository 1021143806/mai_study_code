<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦麦学代码</title>
<script type="importmap">
{
  "imports": {
    "codemirror": "/npm/codemirror@6.0.2/+esm",
    "@codemirror/state": "/npm/@codemirror/state@6.5.2/+esm",
    "@codemirror/lang-python": "/npm/@codemirror/lang-python@6.1.6/+esm",
    "@codemirror/theme-one-dark": "/npm/@codemirror/theme-one-dark@6.1.2/+esm"
  }
}
</script>
<link rel="stylesheet" href="static/css/monitor.css">
</head>
<body>

<!-- 顶部栏 -->
<nav id="topbar">
  <a href="/" class="brand"><span class="sf"><svg viewBox="0 0 24 24"><polyline points="4 7 10 12 4 17"/><line x1="13" y1="17" x2="20" y2="17"/></svg></span> 麦麦学代码</a>
  <div class="nav-tabs" id="nav-tabs">
    <!-- 工作区标签由 JS 动态渲染 -->
    <div class="nav-tab" data-page="monitor" onclick="switchPage('monitor')">监控</div>
    <div class="nav-tab" data-page="pages" onclick="switchPage('pages')">我的页面</div>
  </div>
  <div class="right">
    <button class="ws-gear-btn" onclick="showWsDialog()" title="工作区设置"><span class="sf"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span></button>
    <button class="reload-btn" id="reload-btn" onclick="reloadPlugin()" title="重新加载插件"><span class="sf"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span></button>
  </div>
</nav>

<!-- 主区 -->
<div id="workspace">
  <!-- 活动栏 -->
  <div id="activitybar">
    <div class="btn active" data-sidebar="explorer"><span class="sf sf-lg"><svg viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/></svg></span></div>
    <div class="btn" data-sidebar="knowledge"><span class="sf sf-lg"><svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 0 1 4 4c0 1.1-.5 2.1-1.2 2.8.7.5 1.2 1.3 1.2 2.2a3 3 0 0 1-3 3"/><path d="M12 4a4 4 0 0 0-4 4c0 1.1.5 2.1 1.2 2.8-.7.5-1.2 1.3-1.2 2.2a3 3 0 0 0 3 3"/><path d="M8 15a3 3 0 0 0 3 3h2a3 3 0 0 0 3-3"/><path d="M9 10h6"/></svg></span></div>
    <div class="btn" data-sidebar="pages-list"><span class="sf sf-lg"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span></div>
    <div style="flex:1"></div>
    <div class="btn" data-sidebar="config" title="插件配置"><span class="sf sf-lg"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span></div>
  </div>

  <!-- 侧边栏 -->
  <div id="sidebar">
    <div class="header">
      <span id="sidebar-title">资源管理器</span>
      <button class="secondary" style="font-size:10px;padding:1px 5px" onclick="refreshFileTree()"><span class="sf"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span></button>
    </div>
    <div class="content" id="sidebar-content">
      <div id="panel-explorer">
        <div class="section-title">已打开</div>
        <div id="open-files"><div class="tree-item" style="--indent:0;color:var(--text-muted)">暂无打开的文件</div></div>
        <div class="section-title" style="margin-top:6px">最近打开</div>
        <div id="recent-files"><div class="tree-item" style="--indent:0;color:var(--text-muted)">无</div></div>
        <div class="section-title" style="margin-top:6px">工作区</div>
        <div id="file-tree"></div>
      </div>
      <div id="panel-knowledge" style="display:none">
        <div class="section-title">知识库</div>
        <div id="knowledge-tree">加载知识库...</div>
      </div>
      <div id="panel-pages-list" style="display:none">
        <div class="section-title">Bot 页面</div>
        <div id="pages-tree">加载页面列表...</div>
      </div>
    </div>
  </div>

  <div class="resize-handle" data-target="sidebar"></div>

  <!-- 编辑面板 -->
  <div id="editor-panel">
    <div id="editor-tabs"></div>
    <div id="editor-container"></div>
    <div class="editor-bar">
      <button onclick="runCode()"><span class="sf"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></span> 运行</button>
      <button class="secondary" onclick="saveFile()"><span class="sf"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span> 保存</button>
      <select id="editor-lang" onchange="setEditorLang(this.value)" style="font-size:11px;padding:1px 5px">
        <option value="python">Python</option>
        <option value="markdown">Markdown</option>
        <option value="json">JSON</option>
        <option value="text">Text</option>
      </select>
      <span style="flex:1"></span>
      <button class="secondary" id="config-viz-btn" style="font-size:10px;display:none" onclick="toggleConfigVisual()">可视化</button>
    </div>
    <div id="editor-output" style="display:none"></div>
    <div id="config-visual" style="display:none;flex:1;overflow-y:auto;padding:16px;font-size:13px"></div>
  </div>

  <div class="resize-handle" data-target="assistant-panel"></div>

  <!-- 助手面板 - 聊天界面 -->
  <div id="assistant-panel">
    <div class="header">
      <span><span class="sf"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> 对话</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="dot" id="conn-dot-chat" style="width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 4px rgba(52,211,153,0.5)"></span>
        <span style="font-size:10px;color:var(--text-muted)" id="conn-status-chat">已连接</span>
        <button class="secondary" style="font-size:10px;padding:1px 5px;" onclick="clearChat()">清空</button>
        <button class="secondary" style="font-size:10px;padding:1px 6px" onclick="this.closest('#assistant-panel').classList.toggle('collapsed')">收起</button>
      </div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input">
      <textarea id="chat-input-box" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMsg()}"></textarea>
      <button id="chat-send-btn" onclick="sendChatMsg()">发送</button>
    </div>
  </div>
</div>

<!-- 状态栏 -->
<div id="statusbar">
  <span class="item">Ln <span id="status-ln">1</span>, Col <span id="status-col">1</span></span>
  <span class="item">UTF-8</span>
  <span class="item" id="status-lang">Python</span>
  <span class="spacer"></span>
  <span class="item clickable" onclick="toggleAbout()">麦麦学代码 v0.1.0</span>
  <span class="item" id="status-time"></span>
</div>

<!-- 关于 -->
<div id="about-overlay" style="display:none" onclick="if(event.target===this)toggleAbout()">
  <div id="about-box">
    <h2><span class="sf sf-lg"><svg viewBox="0 0 24 24"><polyline points="4 7 10 12 4 17"/><line x1="13" y1="17" x2="20" y2="17"/></svg></span> 麦麦学代码</h2>
    <p>版本 0.1.0</p>
    <p style="font-size:11px;margin-top:6px;color:var(--text-muted)">Frosted Glass — Apple Sonoma 风格</p>
    <button class="close" onclick="toggleAbout()">关闭</button>
  </div>
</div>

<script type="module" src="static/js/app.js"></script>
</body>
</html>
